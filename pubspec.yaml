name: snacky
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  carousel_slider: ^5.1.1
  panorama: ^0.4.1
  provider: ^6.1.5+1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.3
  freezed_annotation: ^3.1.0
  dio: ^5.9.0
  flutter_lints: ^6.0.0
  json_annotation: ^4.9.0
  go_router: ^16.2.1
  flutter_riverpod: ^2.6.1
  fpdart: ^1.1.1
  equatable: ^2.0.7
  image_picker: ^1.2.0
  file_picker: ^10.3.2
  flutter_spinkit: ^5.2.2
  shimmer: ^3.0.0
  logger: ^2.6.2
  intl: ^0.20.2
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.11
  freezed: ^3.2.0
  json_serializable: ^6.11.0
  flutter_launcher_icons: ^0.14.4


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/categories/
    - assets/images/f1.png
    - assets/images/f2.png
    - assets/images/f3.png
    - assets/images/floorplan.jpg
    - assets/images/living_room_360.jpg
    - assets/images/bedroom_360.jpg
    - assets/images/rab.jpeg
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.otf
          weight: 300
        - asset: assets/fonts/Poppins-Medium.otf
          weight: 500
        - asset: assets/fonts/Poppins-Thin.otf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.otf
        - asset: assets/fonts/Poppins-Bold.otf
          weight: 900
        - asset: assets/fonts/Poppins-Italic.otf
          style: italic
